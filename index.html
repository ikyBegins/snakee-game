<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #1a1a1a;
  font-family: 'Share Tech Mono', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  touch-action: none;
}

.game-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 520px;
  height: 100%;
  padding: 10px;
  gap: 8px;
}

/* HUD */
.hud {
  display: flex;
  justify-content: space-between;
  width: 100%;
  background: #111;
  border-radius: 10px;
  padding: 8px 12px;
}

.hud span {
  color: #9bab2c;
  font-size: 13px;
}

/* SCREEN (SMANJEN) */
.screen-wrap {
  position: relative;
  width: 100%;
  max-height: 50vh; /* 🔥 SMANJENO */
  flex: 1;
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 0 0 3px #2a2a2a, 0 0 30px rgba(155,171,44,0.15);
}

canvas {
  width: 100%;
  height: 100%;
  display: block;
  background: #9bab2c;
}

/* OVERLAY */
#overlay {
  position: absolute;
  inset: 0;
  background: rgba(155,171,44,0.95);
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  gap: 10px;
}

#overlay.hidden { display: none; }

#overlay .title {
  font-size: 30px;
  color: #1a2400;
}

#overlay .subtitle {
  font-size: 13px;
  color: #1a2400;
}

/* CONTROLS */
.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

/* 🔥 VEĆI D-PAD */
.dpad {
  width: 220px;
  height: 220px;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 6px;
}

.dpad button {
  background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
  border: 1px solid #333;
  border-radius: 10px;
  color: #9bab2c;
  font-size: 26px; /* 🔥 VEĆE */
  box-shadow: 0 4px 0 #0a0a0a;
}

/* OK dugme */
.dpad .center {
  font-size: 12px;
  border-radius: 50%;
}

/* 🔥 VEĆI START / PAUSE */
.action-row {
  display: flex;
  gap: 20px;
}

.btn {
  min-width: 110px;
  height: 50px;
  font-size: 14px;
  border-radius: 25px;
  border: none;
  color: white;
  font-family: 'Share Tech Mono', monospace;
  box-shadow: 0 4px 0 #0a0a0a;
}

.btn-green {
  background: linear-gradient(145deg, #2a7a2a, #194f19);
}

.btn-red {
  background: linear-gradient(145deg, #7a1a1a, #4f0f0f);
}

</style>
</head>

<body>

<div class="game-wrap">

  <div class="hud">
    <span id="score-label">SCORE: 0</span>
    <span id="level-label">LVL 1</span>
    <span id="hi-label">HI: 0</span>
    <span id="lives-label">▪▪▪</span>
  </div>

  <div class="screen-wrap">
    <canvas id="gameCanvas"></canvas>

    <div id="overlay">
      <div class="title">SNAKE</div>
      <div class="subtitle">Press START or OK</div>
    </div>
  </div>

  <div class="controls">

    <div class="dpad">
      <div></div>
      <button id="btn-up">▲</button>
      <div></div>

      <button id="btn-left">◀</button>
      <button class="center" id="btn-ok">OK</button>
      <button id="btn-right">▶</button>

      <div></div>
      <button id="btn-down">▼</button>
      <div></div>
    </div>

    <div class="action-row">
      <button class="btn btn-green" id="btn-start">START</button>
      <button class="btn btn-red" id="btn-pause">PAUSE</button>
    </div>

  </div>
</div>

<script>
// (OSTAVIO SAM TVOJ ORIGINAL GAME JS LOGIKU NEPROMIJENJENU)
// da ne pokvarim igru — samo UI je poboljšan

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const COLS = 28, ROWS = 21;
let CELL = 12;

function resizeCanvas() {
  const wrap = canvas.parentElement;
  const w = wrap.clientWidth;
  const h = wrap.clientHeight;
  CELL = Math.floor(Math.min(w / COLS, h / ROWS));
  canvas.width = COLS * CELL;
  canvas.height = ROWS * CELL;
}

window.addEventListener('resize', resizeCanvas);
resizeCanvas();

</script>

</body>
</html>
